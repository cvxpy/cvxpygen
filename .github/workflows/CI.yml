name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Python build system
      run: |
        pip install --upgrade pip
        pip install build setuptools wheel

    - name: Install cvxpy from source
      run: |
        # TEMPORARY: cvxpy from the canon-param-api branch until cvxpy/cvxpy#3604 is merged; then revert.
        git clone --branch canon-param-api https://github.com/cvxpy/cvxpy.git
        cd cvxpy
        pip install .

    - name: Install cvxpylayers from source
      if: runner.os == 'Linux'
      run: |
        # TEMPORARY: cvxpylayers from the canon-param-api branch until its PR is merged; then revert.
        git clone --branch canon-param-api https://github.com/cvxpy/cvxpylayers.git
        cd cvxpylayers
        pip install ".[torch, jax]"

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install libeigen3-dev
        pip install .[dev]

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install eigen
        pip install .[dev]

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        vcpkg install eigen3:x64-windows
        pip install .[dev]

    - name: Test with pytest (Linux)
      if: runner.os == 'Linux'
      run: |
        cd tests
        python -m pytest test_readme.py test_invalid_input.py test_E2E_LP.py test_E2E_QP.py test_E2E_SOCP.py test_explicit.py test_diff.py

    - name: Test with pytest (macOS)
      if: runner.os == 'macOS'
      run: |
        cd tests
        python -m pytest test_readme.py test_invalid_input.py test_E2E_LP.py test_E2E_QP.py test_E2E_SOCP.py test_explicit.py

    - name: Test with pytest (Windows)
      if: runner.os == 'Windows'
      run: |
        cd tests
        python -m pytest test_readme.py test_invalid_input.py test_E2E_LP.py::test test_E2E_LP.py::test_qocogen test_E2E_QP.py::test test_E2E_QP.py::test_OSQP_verbose test_E2E_SOCP.py::test test_unsupported_solvers.py
